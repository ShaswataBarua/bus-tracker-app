<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Driver Location Share</title>
    <style>
      :root {
        --blue-900: #0c4ea2;
        --blue-700: #135fc5;
        --bg: #f3f8ff;
        --card: #ffffff;
        --text: #1d2a36;
        --muted: #4a5d70;
        --green: #1cae66;
        --danger: #d94d4d;
        --stroke: #d7e7ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #eef6ff, #f7fbff);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        box-shadow: 0 14px 32px rgba(12, 78, 162, 0.12);
        padding: 24px 20px;
      }

      .title {
        text-align: center;
        color: var(--blue-900);
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }

      .status {
        background: #edf5ff;
        border: 1px solid var(--stroke);
        border-radius: 12px;
        padding: 14px 16px;
        text-align: center;
        font-weight: 700;
        color: var(--blue-900);
        margin-bottom: 20px;
      }

      .status.off {
        color: var(--muted);
        background: #f5f7fa;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .start-btn {
        background: var(--green);
        color: white;
      }

      .stop-btn {
        background: var(--danger);
        color: white;
      }

      .note {
        margin-top: 18px;
        font-size: 0.9rem;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">Driver Location</h1>
      <div id="status" class="status off">Stopped</div>

      <div class="actions">
        <button class="start-btn" id="startBtn" type="button">Start Sharing</button>
        <button class="stop-btn" id="stopBtn" type="button">Stop</button>
      </div>

      <div class="note">Location is shared every 10 seconds to Firebase.</div>
      <div class="note">
        <a href="./index.html">Routes</a> · <a href="./track.html">Live track</a>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAynPmLrkqPKD5VHd1HY2vt-bq5xmJ9fuc",
        authDomain: "bus-tracker-11b51.firebaseapp.com",
        databaseURL: "https://bus-tracker-11b51-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bus-tracker-11b51",
        storageBucket: "bus-tracker-11b51.firebasestorage.app",
        messagingSenderId: "28373051420",
        appId: "1:28373051420:web:da11dd98ec4249b31697d9"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let watchId = null;
      let intervalId = null;
      let isSharing = false;

      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');

      function setStatus(message, active = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('off', !active);
      }

      async function sendLocationToFirebase(lat, lng, accuracy) {
        const locationData = {
          latitude: lat,
          longitude: lng,
          accuracy: accuracy,
          updatedAt: Date.now()
        };

        try {
          await set(ref(db, 'busLocation/route1'), locationData);
          console.log('Location saved to Firebase');
        } catch (error) {
          console.error('Error saving location:', error);
        }
      }

      function handleLocation(position) {
        const { latitude, longitude, accuracy } = position.coords;
        sendLocationToFirebase(latitude, longitude, accuracy);
      }

      function handleError(error) {
        console.error('Geolocation error:', error);
        setStatus('Location access denied', false);
      }

      function startSharing() {
        if (!navigator.geolocation) {
          setStatus('Geolocation is not supported', false);
          return;
        }

        isSharing = true;
        setStatus('Sharing location...', true);

        watchId = navigator.geolocation.watchPosition(handleLocation, handleError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });

        intervalId = setInterval(() => {
          if (!isSharing) return;

          navigator.geolocation.getCurrentPosition(handleLocation, handleError, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          });
        }, 10000);
      }

      function stopSharing() {
        isSharing = false;

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        if (intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
        }

        setStatus('Stopped', false);
      }

      startBtn.addEventListener('click', startSharing);
      stopBtn.addEventListener('click', stopSharing);
    </script>
  </body>
</html>
