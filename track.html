<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --green-900: #0a5f3a;
        --green-800: #0f6d42;
        --green-700: #13824f;
        --green-100: #ebfaf1;
        --green-50: #f7fff9;
        --white: #ffffff;
        --text: #1a2a26;
        --muted: #5d7168;
        --border: #d9ebdf;
        --shadow: 0 18px 40px rgba(10, 95, 58, 0.12);
        --card-shadow: 0 12px 24px rgba(16, 96, 64, 0.1);
        --danger: #d14f5a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f4fbf7 0%, #eefaf3 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      .app-shell {
        min-height: 100vh;
        padding: 20px 16px 28px;
      }

      .route-screen,
      .map-screen {
        width: min(100%, 1100px);
        margin: 0 auto;
      }

      .route-screen.hidden,
      .map-screen[hidden] {
        display: none;
      }

      .topbar {
        background: linear-gradient(135deg, var(--green-900), var(--green-700));
        color: var(--white);
        border-radius: 24px;
        padding: 22px 20px 26px;
        box-shadow: var(--shadow);
        margin-bottom: 22px;
      }

      .topbar .eyebrow {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
        opacity: 0.9;
        font-weight: 700;
      }

      .topbar h1 {
        margin: 10px 0 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      .route-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .route-card {
        border: 1px solid var(--border);
        background: var(--white);
        border-radius: 22px;
        padding: 18px 18px 16px;
        box-shadow: var(--card-shadow);
        text-align: left;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .route-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(16, 96, 64, 0.12);
        border-color: rgba(19, 130, 79, 0.26);
      }

      .route-badge {
        display: inline-flex;
        align-items: center;
        background: var(--green-100);
        color: var(--green-900);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .route-card h3 {
        margin: 16px 0 8px;
        font-size: clamp(1.4rem, 2.5vw, 2rem);
        color: var(--text);
      }

      .route-name {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .route-stop-list,
      .route-schedule {
        margin-top: 12px;
        padding: 12px;
        border-radius: 14px;
        background: #f8fffa;
        border: 1px solid rgba(19, 130, 79, 0.12);
        color: var(--text);
        font-size: 0.84rem;
      }

      .route-stop-list strong,
      .route-schedule strong {
        display: block;
        margin-bottom: 8px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--green-900);
      }

      .stop-timeline {
        position: relative;
        margin: 0;
        padding-left: 14px;
      }

      .stop-timeline::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: linear-gradient(180deg, rgba(19,130,79,0.35), rgba(19,130,79,0.12));
      }

      .stop-step {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 4px 0 8px;
        color: var(--text);
      }

      .stop-step.is-last {
        padding-bottom: 0;
      }

      .stop-dot {
        position: relative;
        z-index: 1;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green-700);
        border: 2px solid var(--white);
        box-shadow: 0 0 0 4px rgba(19, 130, 79, 0.12);
        margin-top: 4px;
        flex-shrink: 0;
      }

      .stop-label {
        line-height: 1.5;
      }

      .schedule-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        line-height: 1.5;
        margin-top: 6px;
        color: var(--text);
      }

      .schedule-icon {
        font-size: 1rem;
      }

      .driver-meta {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f5fff8 0%, #ecfaf2 100%);
        border: 1px solid rgba(19, 130, 79, 0.1);
      }

      .driver-status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--green-900);
      }

      .driver-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #a4aeb6;
      }

      .driver-dot.live {
        background: #2ecb75;
        box-shadow: 0 0 0 6px rgba(46, 203, 117, 0.15);
        animation: pulse 1.8s infinite ease-in-out;
      }

      .driver-status-text {
        line-height: 1.4;
      }

      .driver-updated {
        display: block;
        margin-top: 8px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
      }

      .route-card.is-offline .driver-status-text {
        color: var(--muted);
      }

      .route-card.is-offline .driver-dot {
        background: #b4c0ba;
        box-shadow: none;
      }

      .route-card.is-offline .driver-status {
        color: var(--muted);
      }

      .timestamp {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: linear-gradient(135deg, #f3fff8 0%, #ecfbf2 100%);
        border: 1px solid rgba(19, 130, 79, 0.1);
        border-radius: 14px;
        margin-top: 16px;
        min-height: 56px;
      }

      .live-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #2ecb75;
        box-shadow: 0 0 0 6px rgba(46, 203, 117, 0.15);
        animation: pulse 1.8s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.18); opacity: 0.78; }
      }

      .timestamp strong {
        font-size: 0.92rem;
        line-height: 1.4;
        color: var(--green-900);
      }

      .live-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--green-700), var(--green-900));
        color: var(--white);
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        text-decoration: none;
        min-width: 120px;
        margin-top: 16px;
      }

      .map-screen {
        background: rgba(255,255,255,0.65);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0 18px;
      }

      .back-btn {
        border: none;
        background: var(--white);
        color: var(--green-900);
        border-radius: 14px;
        border: 1px solid var(--border);
        padding: 11px 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(16, 96, 64, 0.08);
      }

      .map-header {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        padding: 18px 18px 14px;
        margin-bottom: 16px;
      }

      .map-header .eyebrow {
        display: inline-block;
        color: var(--green-900);
        background: var(--green-100);
        border-radius: 999px;
        padding: 8px 10px;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .map-header h2 {
        margin: 14px 0 0;
        font-size: clamp(1.6rem, 3vw, 2.3rem);
      }

      .map-driver-meta {
        margin-top: 10px;
        font-weight: 700;
        color: var(--green-800);
        background: #f2fff7;
        border: 1px solid rgba(19,130,79,0.12);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
      }

      .map-status {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 14px;
        box-shadow: var(--card-shadow);
        font-weight: 700;
        color: var(--green-900);
      }

      .map-timestamp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: linear-gradient(135deg, #eefef2 0%, #f8fff9 100%);
        border: 1px solid rgba(19, 130, 79, 0.12);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }

      .map-timestamp .label {
        color: var(--muted);
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .map-timestamp strong {
        color: var(--green-900);
        font-size: 1.25rem;
      }

      .map-wrap {
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      #map {
        width: 100%;
        height: 68vh;
        min-height: 420px;
        background: #eaf5ee;
      }

      @media (max-width: 700px) {
        .route-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

          routeName: 'Campus shuttle route',
          timeId: 'time-route1',
          stops: ['GEC', '2 No Gate', 'Muradpur', 'Chandgaon Thana', 'Access Road', 'Tulatoli', 'New bridge', 'Moizzartek', 'Shantirhut', 'Badamtol', 'Bypass road', 'Komol munshir hut', 'BGC Biydha Nagar'],
          schedule: 'Leaves 8:15 AM → Reaches Campus 9:30 AM → Returns to drop students 3:00 PM'
        },
        route2: {
          title: 'Bus 2',
          routeName: 'Campus shuttle route',
          timeId: 'time-route2',
          stops: ['Oxygen', 'Muradpur', 'Chandgaon Thana', 'Access Road', 'Tulatoli', 'New bridge', 'Moizzartek', 'Shantirhut', 'Badamtol', 'Bypass road', 'Komol munshir hut', 'BGC Biydha Nagar'],
          schedule: 'Leaves 8:10 AM → Reaches Campus 9:30 AM → Returns to drop students 3:00 PM'
        },
        route3: {
          title: 'Bus 3',
          routeName: 'Campus shuttle route',
          timeId: 'time-route3',
          stops: ['Agrabad', 'Newmarket', 'Kotoyali', 'Newbridge', 'Moizzartek', 'Shantirhut', 'Badamtol', 'Bypass road', 'Komol munshir hut', 'BGC Biydha Nagar'],
          schedule: 'Leaves 8:10 AM → Reaches Campus 9:30 AM → Returns to drop students 3:00 PM'
        },
        route4: {
          title: 'Bus 4',
          routeName: 'Campus shuttle route',
          timeId: 'time-route4',
          stops: ['Anayet bazar', 'DC hill', 'Kotuyali', 'New bridge', 'Moizzartek', 'Shantirhut', 'Badamtol', 'Bypass road', 'Komol munshir hut', 'BGC Biydha Nagar'],
          schedule: 'Leaves 8:10 AM → Reaches Campus 9:30 AM → Returns to drop students 3:00 PM'
        }
      };

      const routeScreen = document.getElementById('routeScreen');
      const mapScreen = document.getElementById('mapScreen');
      const mapTitle = document.getElementById('mapTitle');
      const statusText = document.getElementById('statusText');
      const lastUpdated = document.getElementById('lastUpdated');
      const backToRoutesBtn = document.getElementById('backToRoutes');
      const routeCards = document.querySelectorAll('.route-card');
      const mapDriverMeta = document.getElementById('mapDriverMeta');

      const map = L.map('map', { zoomControl: true, scrollWheelZoom: true }).setView([22.364, 91.812], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      const marker = L.marker([22.364, 91.812]).addTo(map);
      const defaultCenter = [22.364, 91.812];
      let activeUnsubscribe = null;
      let currentRoute = null;

      const routeIcons = {
        route1: '🚍',
        route2: '🚌',
        route3: '🚐',
        route4: '🛺'
      };

      function formatTime(dateValue) {
        const date = new Date(dateValue || Date.now());
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function renderRouteCards() {
        routeCards.forEach((card) => {
          const routeKey = card.dataset.route;
          const timestampEl = card.querySelector('.timestamp strong');
          if (timestampEl) {
            timestampEl.textContent = routeMeta[routeKey].stops.join(' • ');
          }
        });
      }

      function updateRouteTimestamp(routeKey, timeString) {
        const target = document.getElementById(routeMeta[routeKey].timeId);
        if (target) {
          target.textContent = timeString;
        }
      }

      function updateStatus(message) {
        statusText.textContent = message;
      }

      function updateMarker(lat, lng, routeKey) {
        const position = [lat, lng];
        marker.setLatLng(position);
        marker.bindPopup(`${routeIcons[routeKey] || '🚍'} ${routeMeta[routeKey].title}`);
        map.setView(position, Math.max(map.getZoom(), 13));
      }

      function showRouteList() {
        routeScreen.classList.remove('hidden');
        mapScreen.hidden = true;
      }

      function ensureMapVisible() {
        if (!map) return;
        setTimeout(() => {
          map.invalidateSize();
        }, 180);
      }

      function applyDriverCardStatus(routeKey, data) {
        const card = document.querySelector(`.route-card[data-route="${routeKey}"]`);
        if (!card) return;

        const statusTextEl = card.querySelector('.driver-status-text');
        const updatedEl = card.querySelector('.driver-updated');
        const driverDot = card.querySelector('.driver-status .driver-dot');

        const driverName = data && data.driverName ? data.driverName : '';
        const isSharing = Boolean(data && data.isSharing && Number.isFinite(Number(data.latitude)) && Number.isFinite(Number(data.longitude)));

        if (isSharing) {
          card.classList.add('is-live');
          card.classList.remove('is-offline');
          statusTextEl.textContent = driverName ? `Driver: ${driverName} • Sharing` : 'Driver: Sharing';
          if (driverDot) driverDot.classList.add('live');
          const when = formatTime(data.updatedAt || Date.now());
          updatedEl.hidden = false;
          updatedEl.textContent = `Updated ${when}`;
        } else {
          card.classList.remove('is-live');
          card.classList.add('is-offline');
          statusTextEl.textContent = driverName ? `Driver: ${driverName} • Offline` : 'No driver assigned';
          if (driverDot) driverDot.classList.remove('live');
          updatedEl.hidden = true;
          updatedEl.textContent = '';
        }
      }

      let screenStack = ['login'];

      function showScreen(name) {
        routeScreen.classList.toggle('hidden', name !== 'busCards');
        mapScreen.hidden = name !== 'liveMap';
      }

      function showMap(routeKey) {
        currentRoute = routeKey;
        const info = routeMeta[routeKey];
        mapTitle.textContent = info.title;
        ensureMapVisible();
        listenToRoute(routeKey);
        if (screenStack[screenStack.length - 1] !== 'liveMap') {
          screenStack.push('liveMap');
        }
        showScreen('liveMap');
      }

      function showRouteList() {
        if (screenStack[screenStack.length - 1] !== 'busCards') {
          screenStack.push('busCards');
        }
        renderRouteCards();
        showScreen('busCards');
      }

      function goBack() {
        if (screenStack.length > 1) {
          screenStack.pop();
          const prev = screenStack[screenStack.length - 1];
          showScreen(prev);
          if (prev === 'login') {
            window.location.href = 'login.html';
          }
        } else {
          window.location.href = 'login.html';
        }
      }

      function listenToRoute(routeKey) {
        if (activeUnsubscribe) {
          activeUnsubscribe();
        }

        const routeRef = ref(db, `busLocation/${routeKey}`);
        activeUnsubscribe = onValue(routeRef, (snapshot) => {
          const data = snapshot.val();
          const driverName = data && data.driverName ? data.driverName : 'unavailable';
          mapDriverMeta.textContent = driverName !== 'unavailable' ? `Driver: ${driverName}` : 'Driver: unavailable';

          if (!data || !data.isSharing || data.latitude === undefined || data.longitude === undefined) {
            const fallback = data && data.driverName ? `Bus offline • ${data.driverName} is not sharing` : `No live data for ${routeMeta[routeKey].title}.`;
            updateStatus(fallback);
            lastUpdated.textContent = '--:--';
            updateRouteTimestamp(routeKey, routeMeta[routeKey].stops.join(' • '));
            applyDriverCardStatus(routeKey, data);
            return;
          }

          const lat = Number(data.latitude);
          const lng = Number(data.longitude);
          const when = formatTime(data.updatedAt || Date.now());

          updateMarker(lat, lng, routeKey);
          updateStatus(`Tracking ${routeMeta[routeKey].title} • ${data.driverName ? `Driver: ${data.driverName}` : 'Driver: active'} • Updated ${when}`);
          lastUpdated.textContent = when;
          updateRouteTimestamp(routeKey, when);
          applyDriverCardStatus(routeKey, data);
        }, (error) => {
          console.error('Firebase listener error:', error);
          updateStatus(`Unable to watch ${routeMeta[routeKey].title}.`);
        });
      }

      routeCards.forEach((card) => {
        card.addEventListener('click', () => {
          const routeKey = card.dataset.route;
          showMap(routeKey);
        });
      });

      backToRoutesBtn.addEventListener('click', () => {
        goBack();
      });

      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        const { App } = window.Capacitor;
        App.addListener('backButton', () => {
          goBack();
        });
      }

      map.setView(defaultCenter, 13);
      marker.bindPopup('Bus 1');
      renderRouteCards();
      screenStack = ['login', 'busCards'];
      showRouteList();
    </script>
  </body>
</html>
