<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --blue-900: #0c4ea2;
        --blue-700: #135fc5;
        --bg: #f3f8ff;
        --card: #ffffff;
        --text: #1d2a36;
        --muted: #4a5d70;
        --green: #1cae66;
        --stroke: #d7e7ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #edf5ff;
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px 32px;
      }

      .topbar {
        background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
        color: white;
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: 0 10px 24px rgba(12, 78, 162, 0.16);
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }

      .controls {
        margin: 18px 0 14px;
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .controls label {
        font-weight: 700;
        color: var(--blue-900);
      }

      select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--stroke);
        min-width: 180px;
        font-size: 1rem;
        background: white;
        color: var(--text);
      }

      .map-wrap {
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--stroke);
        box-shadow: 0 10px 24px rgba(12, 78, 162, 0.12);
      }

      #map {
        height: 70vh;
        min-height: 420px;
        width: 100%;
        background: #eaf4ff;
      }

      .status {
        margin-top: 14px;
        padding: 10px 14px;
        background: #edf5ff;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        color: var(--blue-900);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Bus Live Tracking</h1>
      </div>

      <div class="controls">
        <label for="routeSelect">Select route:</label>
        <select id="routeSelect">
          <option value="route1">Route 1</option>
          <option value="route2">Route 2</option>
          <option value="route3">Route 3</option>
          <option value="route4">Route 4</option>
        </select>
      </div>

      <div class="map-wrap">
        <div id="map"></div>
      </div>

      <div class="status" id="statusText">Waiting for live bus location...</div>
      <div class="status" style="margin-top: 12px; text-align: center;">
        <a href="./index.html" style="color: var(--blue-900); text-decoration: none; font-weight: 700;">Routes</a>
        &nbsp;·&nbsp;
        <a href="./driver.html" style="color: var(--blue-900); text-decoration: none; font-weight: 700;">Driver Share</a>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAynPmLrkqPKD5VHd1HY2vt-bq5xmJ9fuc",
        authDomain: "bus-tracker-11b51.firebaseapp.com",
        databaseURL: "https://bus-tracker-11b51-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bus-tracker-11b51",
        storageBucket: "bus-tracker-11b51.firebasestorage.app",
        messagingSenderId: "28373051420",
        appId: "1:28373051420:web:da11dd98ec4249b31697d9"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const routeSelect = document.getElementById('routeSelect');
      const statusText = document.getElementById('statusText');

      const map = L.map('map').setView([22.364, 91.812], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const marker = L.marker([22.364, 91.812]).addTo(map);
      const routeIcons = {
        route1: '🚍',
        route2: '🚌',
        route3: '🚐',
        route4: '🛺'
      };

      const defaultCenter = [22.364, 91.812];
      let currentRoute = 'route1';
      let activeUnsubscribe = null;

      function updateStatus(message) {
        statusText.textContent = message;
      }

      function updateMarker(lat, lng, routeKey) {
        const position = [lat, lng];
        marker.setLatLng(position);
        marker.bindPopup(`${routeIcons[routeKey] || '🚍'} ${routeKey.toUpperCase()}`);
        map.setView(position, Math.max(map.getZoom(), 13));
      }

      function listenToRoute(routeKey) {
        if (activeUnsubscribe) {
          activeUnsubscribe();
        }

        const routeRef = ref(db, `busLocation/${routeKey}`);
        activeUnsubscribe = onValue(routeRef, (snapshot) => {
          const data = snapshot.val();

          if (!data || data.latitude === undefined || data.longitude === undefined) {
            updateStatus(`No live data for ${routeKey}.`);
            return;
          }

          const lat = Number(data.latitude);
          const lng = Number(data.longitude);
          updateMarker(lat, lng, routeKey);
          updateStatus(`Tracking ${routeKey} • Updated: ${new Date(data.updatedAt || Date.now()).toLocaleTimeString()}`);
        }, (error) => {
          console.error('Firebase listener error:', error);
          updateStatus(`Unable to watch ${routeKey}.`);
        });
      }

      routeSelect.addEventListener('change', (event) => {
        currentRoute = event.target.value;
        listenToRoute(currentRoute);
      });

      routeSelect.value = currentRoute;
      listenToRoute(currentRoute);
      map.setView(defaultCenter, 13);
      marker.bindPopup('Route 1');
    </script>
  </body>
</html>
